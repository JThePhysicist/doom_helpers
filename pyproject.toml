[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doomwad"
version = "0.1.0"
description = "A library and CLI for reading and editing Doom WAD files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "jjgossel" }]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-bdd>=7.0",
    "mutmut>=2.4",
    "radon>=6.0",
    "xenon>=0.9",
    "mypy>=1.8",
]
# Heavy/GPU stack for the headshot -> Doom face sprite pipeline (hudface).
# Kept out of core `dependencies` so installing/testing the rest of the
# repo never requires torch/mediapipe/etc.
sprite-pipeline = [
    "torch>=2.1",
    "diffusers>=0.27",
    "transformers>=4.38",
    "accelerate>=0.27",
    "safetensors>=0.4",
    "mediapipe>=0.10",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "rembg>=2.0",
]

[project.scripts]
doomwad = "doomwad.cli:main"

[tool.setuptools.packages.find]
include = ["doomwad*", "hudface*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"

[tool.mypy]
strict = true
files = ["hudface"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "diffusers.*",
    "transformers.*",
    "mediapipe.*",
    "cv2.*",
    "rembg.*",
]
ignore_missing_imports = true

# doomwad predates strict mode and is out of scope for the hudface pipeline
# task; don't fail hudface's strict check on doomwad's own (pre-existing)
# typing gaps, while still using its real signatures to check hudface's use
# of it.
[[tool.mypy.overrides]]
module = "doomwad.*"
ignore_errors = true

[tool.mutmut]
source_paths = ["hudface/quantizer.py", "doomwad/palette.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_quantizer.py",
    "tests/test_palette_quantization.py",
]
